[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
polars = { version = "0.53.0", features = [
"lazy",
"timezones",
"temporal",
"dynamic_group_by",
"dtype-date",
"dtype-datetime",
"dtype-time",
"dtype-duration",
"dtype-i8",
"dtype-i16",
"dtype-u8",
"dtype-u16",
"dtype-categorical",
"dtype-struct",
"parquet",
"csv",
"json",
"semi_anti_join",
"rows"
] }
chrono = { version = "0.4.41", features = ["std"] }
rust_decimal = { version = "1.40.0", features = ["macros"] }
rust_decimal_macros = "1.40.0"
rand = "0.9.2"
# sqlx = {version = "0.8.6", features = ["runtime-tokio-native-tls", "sqlite", "migrate"], default-features = false}
reqwest = { version = "0.11.22", features = ["json", "blocking"] }
dotenvy = "0.15.7"
# libsql = { git = "https://github.com/tursodatabase/libsql" }
tracing-subscriber = "0.3"
tracing = "0.1.40"
sqlite3-parser = "0.16.0"
libsql = "0.9.30"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# [patch.crates-io]
# sqlite3-parser = { git = "https://github.com/LucioFranco/lemon-rs" }
